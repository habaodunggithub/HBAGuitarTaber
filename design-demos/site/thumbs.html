<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Download page: six candidates</title>
<style>
@font-face { font-family: 'Six Caps'; src: url('../../site/fonts/six-caps-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'Caveat'; font-weight: 700; src: url('../../site/fonts/caveat-latin-700-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 400; src: url('../../site/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-weight: 500; src: url('../../site/fonts/ibm-plex-mono-latin-500-normal.woff2') format('woff2'); }
:root { --paper:#efe7d6; --paper-2:#e5dbc5; --paper-3:#f6f0e3; --ink:#1d1b18; --ink-2:#4f493f; --ink-3:#8c8473; --blue:#2457c5; --hl:#f7d54a; --staff:rgba(36,87,197,.1);
  --display:'Six Caps','Arial Narrow',sans-serif; --hand:'Caveat',cursive; --mono:'IBM Plex Mono',monospace; }
* { box-sizing: border-box; }
body { margin: 0; background: #d9d2c3; font-family: var(--mono); color: var(--ink); padding: 28px; }
h1 { font: 500 14px var(--mono); letter-spacing: .06em; margin: 0 0 18px; }
.grid { display: grid; grid-template-columns: repeat(3, 480px); gap: 26px 22px; }
figure { margin: 0; }
figcaption { font-size: 12px; margin-top: 8px; color: var(--ink-2); }
figcaption b { color: var(--ink); }
.t { width: 480px; height: 300px; overflow: hidden; position: relative; background: var(--paper); }
.staff { background-image: repeating-linear-gradient(to bottom, transparent 0 7px, var(--staff) 7px 8px, transparent 8px 12px); background-size: 100% 60px; }
.d { font-family: var(--display); line-height: .86; text-transform: uppercase; }
.h { font-family: var(--hand); font-weight: 700; }
.m { font-family: var(--mono); }
.shot { position: absolute; border: 1.5px solid var(--ink); background-size: cover; background-position: top left; }

/* 1 thumb index */
.t1 .tabs { position: absolute; right: 0; top: 18px; display: grid; gap: 4px; }
.t1 .tabs span { display: block; width: 92px; padding: 9px 10px; font: 500 10px var(--mono); letter-spacing: .08em; border: 1.5px solid var(--ink); border-right: 0; border-radius: 6px 0 0 6px; }
.t1 .tabs span:nth-child(1) { background: var(--blue); color: #fff; width: 112px; }
.t1 .tabs span:nth-child(2) { background: var(--hl); }
.t1 .tabs span:nth-child(3) { background: var(--paper-3); }
.t1 .tabs span:nth-child(4) { background: var(--ink); color: var(--paper); }
.t1 .tabs span:nth-child(5) { background: var(--paper-2); }
.t1 .page { position: absolute; left: 22px; top: 18px; right: 120px; bottom: 18px; border: 1.5px solid var(--ink); background: var(--paper-3); padding: 14px 16px; }
.t1 .page .d { font-size: 84px; color: var(--blue); }
.t1 .page p { font-size: 10px; margin: 6px 0 0; }
.t1 .btn { display: inline-block; margin-top: 10px; background: var(--hl); border: 1.5px solid var(--ink); padding: 6px 10px; font-size: 10px; }
.t1 .shot { width: 150px; height: 94px; right: 14px; bottom: 14px; background-image: url(assets/editor.webp); }

/* 2 storyboard */
.t2 .panels { position: absolute; left: 16px; right: 16px; top: 22px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.t2 .panels div { height: 150px; border: 1.5px solid var(--ink); background: var(--paper-3); position: relative; }
.t2 .panels svg { position: absolute; inset: 10px 10px 34px; width: calc(100% - 20px); height: calc(100% - 44px); }
.t2 .panels i { position: absolute; left: 6px; right: 6px; bottom: 6px; font: 700 15px/1 var(--hand); font-style: normal; }
.t2 .note { position: absolute; left: 150px; top: 200px; width: 200px; background: var(--hl); padding: 10px 12px; transform: rotate(-2deg); font: 700 20px/1 var(--hand); box-shadow: 0 2px 0 rgba(0,0,0,.15); }
.t2 .note small { display: block; font: 400 9px var(--mono); margin-top: 4px; }

/* 3 product cropped */
.t3 { background: var(--paper-2); }
.t3 .line { position: absolute; left: 22px; top: 26px; font-size: 19px; letter-spacing: -.01em; }
.t3 .tags { position: absolute; left: 22px; top: 58px; display: flex; gap: 6px; }
.t3 .tags span { border: 1px solid var(--ink); font-size: 9px; padding: 1px 5px; }
.t3 .shot { left: 150px; top: 70px; width: 470px; height: 294px; background-image: url(assets/editor.webp); box-shadow: -8px 8px 0 rgba(29,27,24,.12); }
.t3 .c { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--blue); color: #fff; font: 500 10px/18px var(--mono); text-align: center; }
.t3 .k { position: absolute; left: 22px; font-size: 9px; color: var(--ink-2); }

/* 4 one button */
.t4 { text-align: center; background: var(--paper-3); }
.t4 img { width: 34px; margin-top: 18px; }
.t4 .name { font: 500 16px var(--mono); margin-top: 4px; }
.t4 .tag { font: 700 18px/1.05 var(--hand); color: var(--ink-2); margin-top: 4px; }
.t4 .pill { display: inline-block; margin-top: 10px; background: var(--blue); color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 10px; }
.t4 .win { position: absolute; left: 60px; right: 60px; top: 166px; height: 170px; border: 1.5px solid var(--ink); border-radius: 8px 8px 0 0; background: var(--paper); overflow: hidden; }
.t4 .win::before { content: '● ● ●'; display: block; font-size: 7px; letter-spacing: 2px; text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--ink-3); color: var(--ink-3); }
.t4 .win div { height: 100%; background: url(assets/home-hero.webp) top left / 100% auto no-repeat; }

/* 5 one object */
.t5 { background: var(--paper-3); }
.t5 svg { position: absolute; left: 50%; top: 40px; width: 120px; transform: translateX(-50%); }
.t5 p { position: absolute; left: 0; right: 0; top: 200px; text-align: center; font-size: 11px; margin: 0; }
.t5 ul { position: absolute; left: 0; right: 0; bottom: 18px; display: flex; justify-content: center; gap: 24px; list-style: none; padding: 0; margin: 0; font-size: 9px; color: var(--ink-2); }

/* 6 mandala */
.t6 .left { position: absolute; left: 20px; top: 24px; width: 150px; }
.t6 .left .d { font-size: 58px; }
.t6 .left p { font-size: 9px; margin: 8px 0; }
.t6 .left .btn { display: inline-block; background: var(--hl); border: 1.5px solid var(--ink); padding: 5px 8px; font-size: 9px; }
.t6 svg { position: absolute; right: -40px; top: -40px; width: 380px; height: 380px; }
</style>
</head>
