[project]
name = "hbaguitartaber"
version = "0.1.0"
description = "Audio -> guitar tab (workspace root)"
requires-python = ">=3.10"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = ["packages/taber_ir", "packages/taber_ml", "services/api"]

[tool.uv.sources]
taber-ir = { workspace = true }
taber-ml = { workspace = true }
taber-api = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "optuna>=3"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
# B008: FastAPI's Depends()/File() defaults are the framework idiom. B905: strict= on zip is noise here.
ignore = ["B008", "B905"]
