[project]
name = "taber-ir"
version = "0.1.0"
description = "Taber IR: schema, tab assembly (fusion + quantize) and exporters. No ML dependencies."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "numpy>=1.24",
  "pyguitarpro>=0.9",
  "mido>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taber_ir"]
