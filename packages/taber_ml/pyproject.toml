[project]
name = "taber-ml"
version = "0.1.0"
description = "Taber analysis phase: audio models, pipeline, CLI. Heavy dependencies live here."
requires-python = ">=3.10"
dependencies = ["taber-ir", "numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "soxr>=0.3", "librosa>=0.10", "pyloudnorm>=0.1", "mir_eval>=0.7", "httpx>=0.27"]

[project.optional-dependencies]
torch = ["torch", "torchaudio", "pesto-pitch", "torchcrepe", "demucs>=4.0"]
video = ["mediapipe>=0.10", "opencv-python-headless>=4.8"]

[project.scripts]
taber = "taber_ml.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taber_ml"]
