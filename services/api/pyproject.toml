[project]
name = "taber-api"
version = "0.1.0"
description = "Taber API: FastAPI + SQLite. Depends on taber-ir only (no torch)."
requires-python = ">=3.10"
dependencies = ["taber-ir", "fastapi>=0.110", "uvicorn[standard]>=0.29", "sqlalchemy>=2.0", "alembic>=1.13", "sse-starlette>=2.0", "python-multipart>=0.0.9", "pydantic-settings>=2.2", "structlog>=24"]

[project.scripts]
taber-api = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
