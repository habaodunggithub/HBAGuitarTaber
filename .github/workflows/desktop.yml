# Desktop installers for Windows, macOS (Apple Silicon) and Linux, each built and smoke-tested on its own OS.
# A tag v* also drafts a GitHub Release with the installers and SHA256SUMS.txt (docs/adr/ADR-012-distribution.md).
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS arm64, os: macos-14 }
          - { name: Linux x64, os: ubuntu-22.04 } # glibc 2.35: the AppImage runs on most current distros
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate yet (ADR-011, action 7)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const fs=require('fs'),f='apps/desktop/package.json',p=JSON.parse(fs.readFileSync(f));p.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --dir apps/web build

      - name: FFmpeg cache (macOS)
        if: runner.os == 'macOS'
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffmpeg-macos
          key: ffmpeg-macos-arm64-${{ hashFiles('apps/desktop/scripts/build-ffmpeg-macos.sh', 'apps/desktop/runtime.config.json') }}
      - name: FFmpeg from source (macOS, LGPL)
        if: runner.os == 'macOS' && steps.ffcache.outputs.cache-hit != 'true'
        run: apps/desktop/scripts/build-ffmpeg-macos.sh ffmpeg-macos

      - name: Stage web, Python runtime files, uv, FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/stage.mjs --ffmpeg ${{ runner.os == 'macOS' && 'ffmpeg-macos' || 'fetch' }}

      - name: Compile the shell
        run: pnpm --dir apps/desktop build

      - name: Smoke test (CPU runtime, API, worker, a take -> tab -> .gp5)
        run: node apps/desktop/dist/smoke.js --home "$RUNNER_TEMP/taber-home" --variant cpu --timeout 1500

      - name: Electron self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          TABER_DESKTOP_HOME: ${{ runner.temp }}/taber-home
          TABER_DESKTOP_SELFTEST: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          xvfb-run -a pnpm --dir apps/desktop exec electron . --no-sandbox

      - name: Package
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.yml --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft the release (check it, then press Publish; the download page updates itself)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "HBA Guitar Taber ${GITHUB_REF_NAME#v}" --generate-notes
