# Desktop installers for Windows, macOS (Apple Silicon) and Linux, each built and smoke-tested on its own OS.
# A tag v* also drafts a GitHub Release with the installers and SHA256SUMS.txt (docs/adr/ADR-012-distribution.md).
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS arm64, os: macos-15 } # Apple Silicon (macos-14 is x64-only and deprecated now)
          - { name: Linux x64, os: ubuntu-22.04 } # glibc 2.35: the AppImage runs on most current distros
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false" # no signing certificate yet (ADR-011, action 7)
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.6"

      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          node -e "const fs=require('fs'),f='apps/desktop/package.json',p=JSON.parse(fs.readFileSync(f));p.version=process.env.GITHUB_REF_NAME.replace(/^v/,'');fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n')"

      - run: pnpm install --frozen-lockfile

      - name: Build the web app
        run: pnpm --dir apps/web build

      - name: FFmpeg cache (macOS)
        if: runner.os == 'macOS'
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ffmpeg-macos
          key: ffmpeg-macos-arm64-${{ hashFiles('apps/desktop/scripts/build-ffmpeg-macos.sh', 'apps/desktop/runtime.config.json') }}
      - name: FFmpeg from source (macOS, LGPL)
        if: runner.os == 'macOS' && steps.ffcache.outputs.cache-hit != 'true'
        run: bash apps/desktop/scripts/build-ffmpeg-macos.sh ffmpeg-macos

      - name: Stage web, Python runtime files, uv, FFmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node apps/desktop/scripts/stage.mjs --ffmpeg ${{ runner.os == 'macOS' && 'ffmpeg-macos' || 'fetch' }}

      - name: Compile the shell
        run: pnpm --dir apps/desktop build

      - name: Smoke test (CPU runtime, API, worker, a take -> tab -> .gp5)
        run: node apps/desktop/dist/smoke.js --home "$RUNNER_TEMP/taber-home" --variant cpu --timeout 1500

      - name: Electron self-test (Linux, virtual display)
        if: runner.os == 'Linux'
        env:
          TABER_DESKTOP_HOME: ${{ runner.temp }}/taber-home
          TABER_DESKTOP_SELFTEST: "1"
        run: |
          sudo apt-get update -q && sudo apt-get install -yq xvfb
          xvfb-run -a pnpm --dir apps/desktop exec electron . --no-sandbox

      - name: Package
        working-directory: apps/desktop # electron-builder reads package.json from its project dir, not pnpm's
        run: pnpm exec electron-builder --projectDir . --config electron-builder.yml --publish never

      - name: Ad-hoc signature intact (macOS)
        # an unsigned app reaches "Open Anyway" only with its ad-hoc signature whole; a bundle changed after
        # signing is "damaged" and cannot be opened at all (docs/research/unsigned-install-paths.md)
        if: runner.os == 'macOS'
        working-directory: apps/desktop/release
        run: |
          mnt="$RUNNER_TEMP/dmg"
          mkdir -p "$mnt"
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" ./*.dmg
          app=$(ls -d "$mnt"/*.app)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|Format'
          spctl --assess --type execute -vv "$app" || echo "Gatekeeper refuses it, as expected for an app without a Developer ID: users go through Open Anyway"
          hdiutil detach "$mnt"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  ubuntu-2404:
    # the Linux packages are built on 22.04 (glibc 2.35); this installs them on a clean 24.04 the way a user would
    name: Linux x64 on Ubuntu 24.04
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TABER_DESKTOP_HOME: ${{ github.workspace }}/taber-home # runner.temp is not available at job level
      TABER_DESKTOP_SELFTEST: "1"
      TABER_DESKTOP_SELFTEST_VARIANT: lite
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-Linux
          path: pkg

      - name: Install the .deb
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb ./pkg/*.deb

      - name: Self-test the installed app (installs the Lite engine, starts it, renders the editor)
        run: xvfb-run -a hba-guitar-taber

      - name: AppImage without libfuse2t64 (what a clean 24.04 does)
        run: |
          chmod +x pkg/*.AppImage
          if ./pkg/*.AppImage --version >out.txt 2>&1; then cat out.txt; else cat out.txt; echo "::notice::AppImage needs libfuse2t64 on Ubuntu 24.04"; fi

      - name: Self-test the AppImage (with libfuse2t64, as the install page says)
        run: |
          sudo apt-get install -yq libfuse2t64
          xvfb-run -a ./pkg/*.AppImage

  release:
    name: Draft release
    needs: [build, ubuntu-2404]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft the release (check it, then press Publish; the download page updates itself)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "HBA Guitar Taber ${GITHUB_REF_NAME#v}" --generate-notes
